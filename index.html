<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novix - AI Anime Pose Generator</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    header p {
      color: #ccc;
      font-size: 14px;
    }

    .container {
      max-width: 600px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .card h2 {
      font-size: 18px;
      margin-bottom: 15px;
    }

    input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fafafa;
    }

    textarea {
      width: 100%;
      height: 110px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      resize: none;
      font-size: 15px;
    }

    .poses {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .pose {
      padding: 12px 5px;
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 9px;
      text-align: center;
      cursor: pointer;
      font-size: 13px;
    }

    .pose.selected {
      background: #111;
      color: white;
      border-color: #111;
    }

    .generate {
      width: 100%;
      padding: 15px;
      background: #111;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #preview {
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      margin-top: 15px;
      border-radius: 10px;
      display: none;
    }

    #result {
      min-height: 180px;
      border: 2px dashed #ccc;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      color: #777;
    }

    .info {
      margin-top: 8px;
      font-size: 13px;
      color: #777;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 13px;
    }

    @media (max-width: 400px) {
      .poses {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>✨ Novix</h1>
    <p>AI Anime Character Pose Generator</p>
  </header>

  <div class="container">

    <div class="card">
      <h2>📸 Upload Your Character</h2>

      <input type="file" id="imageInput" accept="image/*">

      <img id="preview" alt="Image Preview">

      <p class="info">
        Upload your anime character image.
      </p>
    </div>

    <div class="card">
      <h2>✏️ Enter Your Prompt</h2>

      <textarea
        id="prompt"
        placeholder="Example: A happy anime character explaining something..."
      ></textarea>
    </div>

    <div class="card">
      <h2>🎭 Select Pose</h2>

      <div class="poses" id="poseContainer"></div>

      <p class="info">
        Select the pose you want your character to perform.
      </p>
    </div>

    <div class="card">
      <button class="generate" onclick="generateImage()">
        ⚡ Generate Image
      </button>
    </div>

    <div class="card">
      <h2>🖼️ Result</h2>

      <div id="result">
        Your generated image will appear here.
      </div>
    </div>

  </div>

  <footer>
    © 2026 Novix
  </footer>

  <script>

    let selectedPose = null;

    const poseContainer =
      document.getElementById("poseContainer");

    for (let i = 1; i <= 50; i++) {

      const button = document.createElement("div");

      button.className = "pose";
      button.textContent = "Pose " + i;

      button.onclick = function () {

        document.querySelectorAll(".pose")
          .forEach(p => p.classList.remove("selected"));

        button.classList.add("selected");

        selectedPose = i;
      };

      poseContainer.appendChild(button);
    }

    document.getElementById("imageInput")
      .addEventListener("change", function(event) {

        const file = event.target.files[0];

        if (file) {

          const imageURL =
            URL.createObjectURL(file);

          const preview =
            document.getElementById("preview");

          preview.src = imageURL;
          preview.style.display = "block";
        }
      });

    function generateImage() {

      const prompt =
        document.getElementById("prompt").value;

      const result =
        document.getElementById("result");

      if (!selectedPose) {

        result.innerHTML =
          "⚠️ Please select a pose first.";

        return;
      }

      if (!prompt.trim()) {

        result.innerHTML =
          "⚠️ Please enter a prompt.";

        return;
      }

      result.innerHTML =
        "⏳ Pose " + selectedPose +
        " selected.<br><br>" +
        "AI generation will be connected next.";

    }

  </script>

</body>
</html>
